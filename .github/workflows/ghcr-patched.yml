name: 'publish patched server image'

on:
  push:
    branches:
      - fix/exp-sqli
    paths:
      - .github/workflows/ghcr-patched.yml
      - packages/core/**
      - packages/server/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Security regression tests
        run: >-
          pnpm exec vitest run
          packages/core/__tests__/handlers.spec.ts
          packages/server/__tests__/storage-guard.spec.js

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/waline:1.43.4-patched
            ghcr.io/${{ github.repository_owner }}/waline:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
